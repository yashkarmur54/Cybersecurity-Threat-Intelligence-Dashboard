.years button.on{background:#202027;outline:1.5px dotted #fff;outline-offset:-4px}
.big h2{font-size:29px;margin-top:5px;font-weight:700}.big .n{font-size:58px;font-weight:700;line-height:1.1;margin-top:2px}
.tg{margin-top:10px;font-size:14px;font-weight:700}.tg span{margin-left:16px}
#spark{margin-top:6px;display:block}
.sevh{margin-top:22px;font-size:19px;font-weight:700}
.sev{margin-top:12px;font-size:12.5px;font-weight:700}.sev div{display:flex;align-items:center;height:34px}.sev i{width:6px;height:6px;border-radius:50%;margin-right:12px}
.sev .a{width:84px}.sev .p{width:58px}.sev .c{width:70px}
.stage{position:absolute;left:350px;top:34px;width:960px;height:746px}
.right{position:absolute;right:6px;top:84px;width:92px;display:flex;flex-direction:column;gap:12px}
.card{background:#1d1d3d;border-radius:3px;text-align:center;padding:8px 6px;font-size:11px}
.card .t{font-weight:800;font-size:12.5px}.card .v{font-weight:800;font-size:19px;margin:2px 0}
.mini{display:flex;align-items:center;font-size:6.5px;height:9.3px;color:#e6e6ff}.mini em{width:20px;text-align:left;font-style:normal}.mini s{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#f2a678,#e0187f)}
svg text{font-family:inherit}
.tip{position:absolute;z-index:20;background:#101026ee;border:1px solid #5b5bd0;border-radius:6px;padding:8px 11px;font-size:12px;pointer-events:none;display:none;line-height:1.5;max-width:230px}
.cur{position:fixed;width:18px;height:18px;border:2px solid #fff;background:#ffffff55;border-radius:50%;z-index:99;pointer-events:none;left:-40px;top:-40px;transform:translate(-50%,-50%);transition:left .05s,top .05s}
.fade{animation:f .5s ease}@keyframes f{from{opacity:.0}to{opacity:1}}
.hot{cursor:pointer}.hot:hover circle.b{stroke:#fff;stroke-width:2}
